services:
  # PostgreSQL - Required database for both profiles (no profile: always runs)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=openinary
      - POSTGRES_PASSWORD=openinary
      - POSTGRES_DB=openinary
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinary -d openinary"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - openinary-network
    restart: unless-stopped

  # API Only - Profile: api
  api:
    profiles: ["api"]
    # Use pre-built image by default, or build locally with: docker compose --profile api build
    image: openinary/openinary-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount cache folder for persistence
      - cache-data:/app/apps/api/cache
      # Mount public folder for static files
      - public-files:/app/apps/api/public
    # Note: .env files are optional and loaded by init-env.js at runtime if they exist
    environment:
      - NODE_ENV=production
      - MODE=api
      - DATABASE_URL=postgres://openinary:openinary@postgres:5432/openinary
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - API_SECRET=${API_SECRET:-}
      # IMAGE_TAG automatically mapped from IMAGE_TAG (single source of truth)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      # Video queue configuration
      # VIDEO_MAX_CONCURRENT is auto-detected based on RAM (1 worker per 2GB)
      # Override only if you need custom concurrency settings
      - VIDEO_MAX_CONCURRENT=${VIDEO_MAX_CONCURRENT:-}
      - VIDEO_JOB_RETRY_MAX=${VIDEO_JOB_RETRY_MAX:-3}
      - VIDEO_JOB_CLEANUP_HOURS=${VIDEO_JOB_CLEANUP_HOURS:-24}
      - VIDEO_WORKER_POLL_INTERVAL_MS=${VIDEO_WORKER_POLL_INTERVAL_MS:-1000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # Initial Authentication configuration
      - OPENINARY_ADMIN_NAME=${OPENINARY_ADMIN_NAME}
      - OPENINARY_ADMIN_EMAIL=${OPENINARY_ADMIN_EMAIL}
      - OPENINARY_ADMIN_PASSWORD=${OPENINARY_ADMIN_PASSWORD}
      - OPENINARY_GENERATE_API_KEY=${OPENINARY_GENERATE_API_KEY:-true}
    networks:
      - openinary-network
    # Resource limits to prevent video processing from crashing the server
    # Dynamic allocation: configure via env vars or use defaults for 4GB+ systems
    # For 16GB+ systems: DOCKER_MEMORY_LIMIT=12G DOCKER_CPU_LIMIT=4.0
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-2.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-0.5}'
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}

  # Full Stack (API + Web + Nginx) - Profile: full
  openinary:
    profiles: ["full"]
    # Use pre-built image by default, or build locally with: docker compose --profile full build
    image: openinary/openinary:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/full.Dockerfile
      args:
        # NEXT_PUBLIC_API_BASE_URL is needed at build time
        # CORS is handled at runtime in Next.js middleware
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        # IMAGE_TAG is baked into the image at build time (written to /app/version.txt)
        IMAGE_TAG: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount cache folder for persistence
      - cache-data:/app/apps/api/cache
      # Mount public folder for static files
      - public-files:/app/apps/api/public
    # Note: .env files are optional and loaded by init-env.js at runtime if they exist
    environment:
      - NODE_ENV=production
      - MODE=fullstack
      - DATABASE_URL=postgres://openinary:openinary@postgres:5432/openinary
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_INTERNAL_URL=${BETTER_AUTH_INTERNAL_URL:-http://127.0.0.1:3001}
      - API_SECRET=${API_SECRET:-}
      # IMAGE_TAG automatically mapped from IMAGE_TAG (single source of truth)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      # Video queue configuration
      # VIDEO_MAX_CONCURRENT is auto-detected based on RAM (1 worker per 2GB)
      # Override only if you need custom concurrency settings
      - VIDEO_MAX_CONCURRENT=${VIDEO_MAX_CONCURRENT:-}
      - VIDEO_JOB_RETRY_MAX=${VIDEO_JOB_RETRY_MAX:-3}
      - VIDEO_JOB_CLEANUP_HOURS=${VIDEO_JOB_CLEANUP_HOURS:-24}
      - VIDEO_WORKER_POLL_INTERVAL_MS=${VIDEO_WORKER_POLL_INTERVAL_MS:-1000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # Initial Authentication configuration
      - OPENINARY_ADMIN_NAME=${OPENINARY_ADMIN_NAME}
      - OPENINARY_ADMIN_EMAIL=${OPENINARY_ADMIN_EMAIL}
      - OPENINARY_ADMIN_PASSWORD=${OPENINARY_ADMIN_PASSWORD}
      - OPENINARY_GENERATE_API_KEY=${OPENINARY_GENERATE_API_KEY:-false}
    networks:
      - openinary-network
    # Resource limits to prevent video processing from crashing the server
    # Dynamic allocation: configure via env vars or use defaults for 4GB+ systems
    # For 16GB+ systems: DOCKER_MEMORY_LIMIT=12G DOCKER_CPU_LIMIT=4.0
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-2.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-0.5}'
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}

networks:
  openinary-network:
    driver: bridge

volumes:
  cache-data:
  public-files:
  pg-data:
