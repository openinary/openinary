name: ci

# Every package's tests and type-check, on every PR. type-check depends on each
# package's own build in turbo.json, so the apps get built along the way.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No `version:` input: the root packageManager field pins pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Node 20: better-sqlite3 (api, shared) has no prebuilt binary for newer.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check every Dockerfile copies every workspace manifest
        run: node scripts/check-docker-manifests.mjs

      # docs (Astro) needs Node 22.12+, so it runs in the Node 22 step below.
      - name: Test and type-check
        run: pnpm exec turbo run test type-check --continue --filter=!docs

      # The Worker must never bundle sharp, ffmpeg or the filesystem (core's
      # main entrypoint pulls all three). Bundled by wrangler itself, dry run,
      # no container image build, from the core/plans builds above. Wrangler
      # needs Node 22.
      - name: Set up Node.js 22 for wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test, type-check and build the docs
        run: pnpm exec turbo run test type-check build --filter=docs

      - name: Check the Cloud Worker bundle
        working-directory: apps/cloud/server
        run: pnpm run check:bundle
