name: registry

on:
  push:
    branches:
      - main
    paths:
      - 'packages/registry/**'
      - 'packages/ui/src/file-uploader/**'
      - 'packages/core/src/utils/upload-signature.ts'
      - 'apps/marketing/public/r/**'
      - '.github/workflows/registry.yml'
  pull_request:
    paths:
      - 'packages/registry/**'
      - 'packages/ui/src/file-uploader/**'
      - 'packages/core/src/utils/upload-signature.ts'
      - 'apps/marketing/public/r/**'
      - '.github/workflows/registry.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      BETTER_AUTH_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter shared db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter shared db:migrate-deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test shared (db core + auth on Prisma)
        run: pnpm --filter shared test

      - name: Sync file-uploader block from @openinary/ui
        run: node scripts/sync-registry-block.mjs

      - name: Fail if registry's file-uploader is out of sync with @openinary/ui
        run: |
          if ! git diff --exit-code -- packages/registry/src/file-uploader/; then
            echo "::error::packages/registry/src/file-uploader is out of sync with packages/ui. Run 'node scripts/sync-registry-block.mjs' and commit the result."
            exit 1
          fi

      - name: Type-check registry
        run: pnpm --filter registry type-check

      - name: Test the upload signature the registry helper depends on
        run: pnpm --filter @openinary/core test

      - name: Test api (health)
        run: pnpm --filter api test

      - name: Test web (setup routes)
        run: pnpm --filter web test

      # The output is not committed: marketing's prebuild regenerates public/r
      # on every build, so this only proves the registry builds from source.
      - name: Build registry
        run: pnpm --filter registry registry:build
