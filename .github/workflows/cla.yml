name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit, in case the repository's default GITHUB_TOKEN permissions are read-only.
permissions:
  actions: write
  contents: write # signatures are stored in this repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check / collect CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/openinary/openinary/blob/main/CLA.md'
          # Created automatically on first signature — do not commit this file by hand.
          path-to-signatures: 'signatures/version1/cla.json'
          # Must be an unprotected branch. If main ever gets branch protection,
          # point this at a dedicated unprotected branch instead.
          branch: 'main'
          allowlist: florianheysen,dependabot[bot],renovate[bot],github-actions[bot]
          custom-notsigned-prcomment: 'Thanks for the pull request! Openinary is AGPL-3.0, and a commercial license is offered alongside it to fund the project — which means every contribution needs a signed CLA before it can be merged. Please read the <a href="https://github.com/openinary/openinary/blob/main/CLA.md">CLA document</a> and sign it by posting the comment below. You keep ownership of your work, and you only sign once.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks! ✍️'
          lock-pullrequest-aftermerge: false
