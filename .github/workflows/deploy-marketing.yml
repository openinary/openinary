name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 94c4079b2c83ce0a8a9c73c84a80b221
          NEXT_PUBLIC_COSSISTANT_API_KEY: ${{ secrets.NEXT_PUBLIC_COSSISTANT_API_KEY }}
          # ATTIO_API_KEY is NOT set here on purpose: Next.js only inlines NEXT_PUBLIC_*
          # at build time, so a build env var never reaches the Worker at runtime.
          # It lives as a Worker secret (`wrangler secret put ATTIO_API_KEY`).
